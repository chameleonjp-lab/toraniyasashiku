name: Verify and publish Pages
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event_name == 'push' && 'production' || github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: false
          persist-credentials: false
          fetch-depth: 1
      - name: Verify static runtime without installing dependencies
        run: |
          node -e 'if (Number(process.versions.node.split(".")[0]) < 22) process.exit(1)'
          node test/rpc-rank-no.test.cjs
          node test/normal8-actual-caller.test.cjs
          node test/participation.test.cjs
          node test/best-storage.test.cjs
          node test/public-stage.test.cjs
          node test/pages-package.test.cjs
      - name: Copy only the verified runtime into a new temporary directory
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: package
        run: node scripts/package-pages.cjs
      - name: Upload exactly the verified runtime
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ steps.package.outputs.path }}
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Reject a stale production commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -eu
          current="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          test "$current" = "$EXPECTED_SHA"
      - name: Deploy the verified commit artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
